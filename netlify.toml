[build]
  command = "echo 'Sem etapa de build: o site é HTML/JS puro e a API roda em netlify/functions'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # exceljs é carregado direto do node_modules: empacotado, a função falha ao iniciar no Netlify
  external_node_modules = ["exceljs"]
  included_files = []

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
